<svg xmlns="http://www.w3.org/2000/svg" width="620" height="592" viewBox="0 0 620 592" role="img" aria-labelledby="title description">
  <title id="title">Алгоритм выдачи управляющей программы</title>
  <desc id="description">Выбранная редакция копируется во временный файл. После сверки контрольной суммы сервер размещает файл под уникальным именем. Результат передачи сохраняется при успехе и при сбое.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#252525"/>
    </marker>
  </defs>
  <rect width="620" height="592" fill="#fff"/>
  <g fill="#fff" stroke="#252525" stroke-width="1.7" stroke-linejoin="round">
    <rect x="156" y="14" width="128" height="38" rx="19" fill="#eee"/>
    <path d="M100 76 H358 L340 124 H82 Z"/>
    <path d="M220 148 L368 193 L220 238 L72 193 Z" fill="#f5f5f5"/>
    <rect x="416" y="169" width="170" height="48"/>
    <rect x="52" y="263" width="336" height="80"/>
    <path d="M220 365 L379 416 L220 467 L61 416 Z" fill="#f5f5f5"/>
    <rect x="416" y="375" width="170" height="82"/>
    <rect x="52" y="483" width="336" height="47"/>
    <rect x="156" y="542" width="128" height="38" rx="19" fill="#eee"/>
  </g>
  <path d="M586 193 H605 V561 M586 416 H605" fill="none" stroke="#252525" stroke-width="1.7" stroke-linejoin="round"/>
  <circle cx="605" cy="416" r="2.4" fill="#252525"/>
  <g fill="none" stroke="#252525" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M220 52 V76"/>
    <path d="M220 124 V148"/>
    <path d="M368 193 H416"/>
    <path d="M220 238 V263"/>
    <path d="M220 343 V365"/>
    <path d="M379 416 H416"/>
    <path d="M220 467 V483"/>
    <path d="M220 530 V542"/>
    <path d="M605 561 H284"/>
  </g>
  <g fill="#222" font-family="Liberation Sans, Arial, sans-serif" font-size="17" text-anchor="middle">
    <text x="220" y="39">Начало</text>
    <text x="220" y="96">Запрос технолога</text>
    <text x="220" y="116">на выдачу редакции</text>
    <text x="220" y="199">Выдача допустима?</text>
    <text x="501" y="189">Отклонить</text>
    <text x="501" y="209">запрос</text>
    <text x="220" y="286">Скопировать во временный файл,</text>
    <text x="220" y="308">сверить контрольную сумму</text>
    <text x="220" y="330">и при совпадении разместить файл</text>
    <text x="220" y="411">Файл проверен</text>
    <text x="220" y="432">и размещён?</text>
    <text x="501" y="400">Записать сбой</text>
    <text x="501" y="421">и сообщить причину</text>
    <text x="501" y="442">технологу</text>
    <text x="220" y="502">Сохранить успешный результат</text>
    <text x="220" y="522">и предоставить оператору путь</text>
    <text x="220" y="567">Конец</text>
  </g>
  <g fill="#222" font-family="Liberation Sans, Arial, sans-serif" font-size="15">
    <text x="375" y="184">Нет</text>
    <text x="229" y="256">Да</text>
    <text x="382" y="407">Нет</text>
    <text x="229" y="480">Да</text>
  </g>
</svg>
